name: Bug Report
description: Something isn't working correctly
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real API keys, service account JSON, attendee data, or roster PDFs.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where are you running this?
      placeholder: "Local macOS / Cloud Run / Ubuntu server"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected vs. what actually happened.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python main.py "Rutas"`
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Remove any secrets before pasting.
      render: shell
