[tool.ruff]
line-length = 110
# Exclude generated output and binary assets from linting
exclude = ["previews/", "assets/", "groups_to_check_ins.py"]

[tool.ruff.lint]
# An explicit rule set, so a new ruff release (whose defaults change) can't
# turn CI red on code nobody touched. ruff itself is pinned in requirements-dev.txt.
#   E4/E7/E9, F — pycodestyle errors and pyflakes (ruff's long-standing defaults)
#   I           — import sorting
#   UP          — pyupgrade (modern syntax for the Python 3.11 runtime)
#   B           — bugbear (likely bugs)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# B008 — function call in default argument: FastAPI's Depends(...) pattern in api.py
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
