<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Reports</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #dfe3ea;
    --accent: #2456c8; --accent-ink: #ffffff; --ok: #1a7f4b; --bad: #b3261e; --warn: #9a6400;
    --soft: #eef2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --ink: #e8ebf1; --muted: #9aa4b5; --line: #2c3442;
            --accent: #7ea2ff; --accent-ink: #0d1220; --ok: #5fd39a; --bad: #ff8a80; --warn: #f0c060;
            --soft: #222a3a; }
  }
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 980px; margin: 0 auto; padding: 14px 16px; display: flex; gap: 12px;
         align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  h1 { font-size: 26px; margin: 0 0 6px; text-wrap: balance; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           padding: 9px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); color: var(--ink); width: 100%; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px;
          background: var(--soft); color: var(--ink); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); }
  .report { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .report b { display: block; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  pre { background: var(--soft); border-radius: 8px; padding: 12px; max-height: 300px; overflow: auto;
        font-size: 13px; margin: 10px 0 0; white-space: pre-wrap; }
  .files { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px;
           max-height: 320px; overflow: auto; }
  .files .folder { font-weight: 600; margin-top: 8px; }
  .notice { border-left: 4px solid var(--warn); padding: 8px 12px; background: var(--soft); border-radius: 6px; }
  .error { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span id="church-name">Advanced Reports</span>
      <small data-t="tagline"></small></div>
    <div class="grow"></div>
    <span class="muted small" id="who"></span>
    <button id="lang" type="button" aria-label="Language"></button>
    <button id="logout" type="button" hidden data-t="sign_out"></button>
  </div>
</header>

<main id="signin" hidden>
  <section class="card">
    <h1 data-t="welcome"></h1>
    <p class="muted" data-t="welcome_body"></p>
    <div class="row" id="signin-buttons"></div>
    <p class="muted small" id="signin-note" style="margin-top:12px"></p>
    <p class="error" id="signin-error" role="alert"></p>
  </section>
</main>

<main id="dash" hidden>
  <section class="card" id="needs-reconnect" hidden>
    <p class="notice" data-t="needs_reconnect"></p>
  </section>

  <section class="card">
    <div class="row">
      <div class="grow">
        <h2 data-t="run_title"></h2>
        <p class="muted" data-t="run_body" style="margin:0"></p>
      </div>
      <button class="primary" id="run-now" type="button" data-t="run_now"></button>
    </div>
    <p class="error" id="run-error" role="alert"></p>
    <div id="run-live" hidden aria-live="polite">
      <div class="row" style="margin-top:12px">
        <span class="pill" id="run-status"></span>
        <span class="muted small" id="run-summary"></span>
      </div>
      <ul class="files" id="run-files"></ul>
      <details style="margin-top:10px"><summary data-t="show_log"></summary><pre id="run-log"></pre></details>
    </div>
  </section>

  <section class="card">
    <h2 data-t="reports_title"></h2>
    <p class="muted small" data-t="reports_body"></p>
    <div class="grid" id="reports"></div>
  </section>

  <section class="card">
    <h2 data-t="history_title"></h2>
    <div class="scroll"><table>
      <thead><tr><th data-t="h_when"></th><th data-t="h_status"></th><th data-t="h_by"></th>
        <th class="num" data-t="h_files"></th><th class="num" data-t="h_time"></th>
        <th class="num" data-t="h_requests"></th><th></th></tr></thead>
      <tbody id="history"></tbody>
    </table></div>
    <p class="muted small" id="history-empty" data-t="history_empty"></p>
  </section>

  <section class="card">
    <h2 data-t="connections_title"></h2>
    <div class="grid">
      <div class="report"><b>Planning Center</b><span class="pill" id="conn-pco"></span>
        <p class="muted small" id="conn-pco-note" style="margin:8px 0 0"></p></div>
      <div class="report"><b>Google Drive</b><span class="pill warn" data-t="not_yet"></span>
        <p class="muted small" data-t="google_note" style="margin:8px 0 0"></p></div>
    </div>
  </section>

  <section class="card">
    <h2 data-t="church_title"></h2>
    <form id="church-form">
      <div class="grid">
        <label><span data-t="f_name"></span><input name="name" required maxlength="120"></label>
        <label><span data-t="f_timezone"></span><input name="timezone" required list="tz-list"></label>
        <label><span data-t="f_language"></span><select name="language"></select></label>
        <label><span data-t="f_theme"></span><select name="theme"></select></label>
        <label><span data-t="f_verse"></span><input name="verse_text" maxlength="300"></label>
        <label><span data-t="f_verse_ref"></span><input name="verse_ref" maxlength="300"></label>
        <label><span data-t="f_help"></span><input name="help_contact" maxlength="300"></label>
        <label><span data-t="f_feedback"></span><input name="feedback_url" type="url" maxlength="300"></label>
      </div>
      <datalist id="tz-list"></datalist>
      <div class="row" style="margin-top:14px">
        <button class="primary" type="submit" data-t="save"></button>
        <span class="small" id="church-msg" role="status"></span>
      </div>
    </form>
  </section>

  <section class="card">
    <h2 data-t="danger_title"></h2>
    <p class="muted small" data-t="danger_body"></p>
    <button class="danger" id="disconnect" type="button" data-t="disconnect"></button>
  </section>
</main>

<script>
const TEXT = {
  en: {
    tagline: "Advanced Reports for Planning Center", sign_out: "Sign out",
    welcome: "Rosters your teachers can use, made from Planning Center Check-Ins",
    welcome_body: "Sign in as an administrator of your church's Planning Center account to set up your reports.",
    sign_in_pco: "Sign in with Planning Center",
    dev_note: "Development sign-in is on. These buttons skip Planning Center sign-in and exist only on this computer.",
    no_signin: "Planning Center sign-in is not configured on this server yet.",
    needs_reconnect: "Planning Center needs to be reconnected. Sign out and sign in again.",
    run_title: "Make this week's reports",
    run_body: "Reads check-ins from Planning Center and builds every report below.",
    run_now: "Run now", running: "Running…", show_log: "Show the run log",
    st_queued: "Waiting to start", st_running: "Running", st_succeeded: "Finished", st_failed: "Failed",
    summary: (f, s, r) => `${f} files · ${s} s · ${r} Planning Center requests`,
    reports_title: "Reports", reports_body: "Each report makes one roster per class or route.",
    no_reports: "No reports are set up yet.",
    tag_history_since: d => `since ${d}`, tag_history_weeks: n => `last ${n} weeks`,
    tag_active: n => `on the list if seen in ${n} Sundays`, tag_route: e => `route column from ${e}`,
    tag_summary: "attendance summary", tag_volunteers: "volunteer sheet", tag_instructions: "instructions",
    tag_disabled: "turned off",
    history_title: "Past runs", history_empty: "No runs yet.",
    h_when: "Started", h_status: "Result", h_by: "Started by", h_files: "Files", h_time: "Time",
    h_requests: "Requests", view: "View",
    connections_title: "Connections", connected: "Connected", not_connected: "Not connected",
    not_yet: "Not available yet",
    google_note: "For now, finished PDFs are kept here for you to open or download. Saving to your Google Drive comes next.",
    pco_oauth: "Signed in with Planning Center.", pco_pat: "Using the church's existing access token (imported).",
    pco_demo: "Made-up data for demonstration.",
    church_title: "Church settings", f_name: "Church name", f_timezone: "Time zone",
    f_language: "Language of the PDFs", f_theme: "Seasonal theme", f_verse: "Footer text (for example, a verse)",
    f_verse_ref: "Footer reference", f_help: "Who to ask for help", f_feedback: "Feedback form link",
    theme_none: "None", lang_en: "English", lang_es: "Spanish", save: "Save", saved: "Saved.",
    theme_primavera: "Spring", theme_verano: "Summer", theme_otono: "Fall", theme_invierno: "Winter",
    danger_title: "Disconnect", disconnect: "Disconnect and delete everything",
    danger_body: "Removes this church's settings, saved connection, run history and PDFs from Advanced Reports. Nothing in Planning Center is changed.",
    confirm_disconnect: "Delete everything Advanced Reports stores for this church? This cannot be undone.",
    err_generic: "Something went wrong. Please try again.",
  },
  es: {
    tagline: "Advanced Reports para Planning Center", sign_out: "Cerrar sesión",
    welcome: "Listas que sus maestros pueden usar, hechas con Planning Center Check-Ins",
    welcome_body: "Inicie sesión como administrador de la cuenta de Planning Center de su iglesia para configurar sus reportes.",
    sign_in_pco: "Iniciar sesión con Planning Center",
    dev_note: "El acceso de desarrollo está activo. Estos botones omiten el inicio de sesión de Planning Center y solo existen en esta computadora.",
    no_signin: "El inicio de sesión con Planning Center aún no está configurado en este servidor.",
    needs_reconnect: "Hay que volver a conectar Planning Center. Cierre sesión e inicie de nuevo.",
    run_title: "Generar los reportes de esta semana",
    run_body: "Lee las asistencias de Planning Center y genera todos los reportes de abajo.",
    run_now: "Generar ahora", running: "Generando…", show_log: "Ver el registro",
    st_queued: "En espera", st_running: "En proceso", st_succeeded: "Terminado", st_failed: "Falló",
    summary: (f, s, r) => `${f} archivos · ${s} s · ${r} solicitudes a Planning Center`,
    reports_title: "Reportes", reports_body: "Cada reporte genera una lista por clase o ruta.",
    no_reports: "Aún no hay reportes configurados.",
    tag_history_since: d => `desde ${d}`, tag_history_weeks: n => `últimas ${n} semanas`,
    tag_active: n => `en la lista si vino en ${n} domingos`, tag_route: e => `columna de ruta de ${e}`,
    tag_summary: "resumen de asistencia", tag_volunteers: "hoja de voluntarios", tag_instructions: "instrucciones",
    tag_disabled: "desactivado",
    history_title: "Ejecuciones anteriores", history_empty: "Aún no hay ejecuciones.",
    h_when: "Inicio", h_status: "Resultado", h_by: "Iniciado por", h_files: "Archivos", h_time: "Tiempo",
    h_requests: "Solicitudes", view: "Ver",
    connections_title: "Conexiones", connected: "Conectado", not_connected: "Sin conectar",
    not_yet: "Aún no disponible",
    google_note: "Por ahora, los PDF terminados se guardan aquí para abrirlos o descargarlos. Guardarlos en su Google Drive es el siguiente paso.",
    pco_oauth: "Sesión iniciada con Planning Center.", pco_pat: "Usa el token de acceso existente de la iglesia (importado).",
    pco_demo: "Datos inventados para demostración.",
    church_title: "Datos de la iglesia", f_name: "Nombre de la iglesia", f_timezone: "Zona horaria",
    f_language: "Idioma de los PDF", f_theme: "Tema de temporada", f_verse: "Texto al pie (por ejemplo, un versículo)",
    f_verse_ref: "Referencia al pie", f_help: "A quién pedir ayuda", f_feedback: "Enlace del formulario de comentarios",
    theme_none: "Ninguno", lang_en: "Inglés", lang_es: "Español", save: "Guardar", saved: "Guardado.",
    theme_primavera: "Primavera", theme_verano: "Verano", theme_otono: "Otoño", theme_invierno: "Invierno",
    danger_title: "Desconectar", disconnect: "Desconectar y borrar todo",
    danger_body: "Elimina de Advanced Reports la configuración, la conexión guardada, el historial y los PDF de esta iglesia. No se cambia nada en Planning Center.",
    confirm_disconnect: "¿Borrar todo lo que Advanced Reports guarda de esta iglesia? No se puede deshacer.",
    err_generic: "Algo salió mal. Inténtelo de nuevo.",
  },
};

let lang = "en";
try { lang = localStorage.getItem("ar_lang") || (navigator.language || "en").slice(0, 2); } catch (e) {}
if (!TEXT[lang]) lang = "en";
const t = key => TEXT[lang][key] ?? key;
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids);
  return node;
};

let state = { me: null, reports: [], runs: [], watching: null, timer: null };

async function api(path, options = {}) {
  const init = { method: options.method || "GET", headers: {}, credentials: "same-origin" };
  if (init.method !== "GET") init.headers["X-AR-CSRF"] = "1";
  if (options.body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(options.body);
  }
  const response = await fetch(path, init);
  let data = null;
  try { data = await response.json(); } catch (e) {}
  if (!response.ok) {
    const error = new Error((data && typeof data.detail === "string" && data.detail) || t("err_generic"));
    error.status = response.status;
    throw error;
  }
  return data;
}

function applyText() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = t(n.dataset.t); });
  $("lang").textContent = lang === "en" ? "Español" : "English";
}

const when = iso => iso ? new Date(iso).toLocaleString(lang, { dateStyle: "medium", timeStyle: "short" }) : "";
const statusClass = s => s === "succeeded" ? "ok" : s === "failed" ? "bad" : "warn";

function renderSignin(config) {
  const box = $("signin-buttons");
  box.replaceChildren();
  if (config.pco_oauth) {
    box.append(el("a", { className: "btn", href: "/auth/pco/login", textContent: t("sign_in_pco") }));
  }
  for (const church of config.dev_churches) {
    const button = el("button", { type: "button", textContent: `${church.name} (${church.note})` });
    button.addEventListener("click", async () => {
      button.disabled = true;
      $("signin-error").textContent = "";
      try { await api("/auth/dev/login", { method: "POST", body: { church: church.id } }); await start(); }
      catch (error) { $("signin-error").textContent = error.message; button.disabled = false; }
    });
    box.append(button);
  }
  $("signin-note").textContent = config.dev_churches.length ? t("dev_note") : (config.pco_oauth ? "" : t("no_signin"));
}

function renderReports() {
  const box = $("reports");
  box.replaceChildren();
  if (!state.reports.length) { box.append(el("p", { className: "muted", textContent: t("no_reports") })); return; }
  for (const r of state.reports) {
    const tags = [
      r.start_date ? t("tag_history_since")(r.start_date) : t("tag_history_weeks")(r.history_weeks),
      t("tag_active")(r.default_weeks),
    ];
    if (r.show_route && r.route_source_event) tags.push(t("tag_route")(r.route_source_event));
    if (r.attendance_summary) tags.push(t("tag_summary"));
    if (r.volunteer_report) tags.push(t("tag_volunteers"));
    if (r.instructions) tags.push(t("tag_instructions"));
    if (r.enabled === false) tags.push(t("tag_disabled"));
    box.append(el("div", { className: "report" },
      el("b", { textContent: `${r.icon || ""} ${r.label}` }),
      el("span", { className: "muted small", textContent: r.pco_event }),
      el("div", { className: "tags" }, ...tags.map(x => el("span", { className: "pill", textContent: x })))));
  }
}

function renderHistory() {
  const body = $("history");
  body.replaceChildren();
  $("history-empty").hidden = state.runs.length > 0;
  for (const run of state.runs) {
    const view = el("button", { type: "button", textContent: t("view") });
    view.addEventListener("click", () => watch(run.id));
    body.append(el("tr", {},
      el("td", { textContent: when(run.started_at || run.created_at) }),
      el("td", {}, el("span", { className: `pill ${statusClass(run.status)}`, textContent: t("st_" + run.status) })),
      el("td", { textContent: run.started_by || "" }),
      el("td", { className: "num", textContent: run.files ?? "" }),
      el("td", { className: "num", textContent: run.timings?.total_s != null ? `${run.timings.total_s} s` : "" }),
      el("td", { className: "num", textContent: run.usage?.pco?.requests ?? "" }),
      el("td", {}, view)));
  }
}

function renderRun(run) {
  $("run-live").hidden = false;
  const status = $("run-status");
  status.className = `pill ${statusClass(run.status)}`;
  status.textContent = t("st_" + run.status);
  const done = run.status === "succeeded" || run.status === "failed";
  $("run-summary").textContent = done
    ? t("summary")(run.files, run.timings?.total_s ?? "–", run.usage?.pco?.requests ?? 0) : "";
  $("run-error").textContent = run.error || "";
  const log = $("run-log");
  log.textContent = (run.log || []).join("\n");
  log.scrollTop = log.scrollHeight;
  const list = $("run-files");
  list.replaceChildren();
  let folder = null;
  for (const file of run.outputs || []) {
    const cut = file.path.lastIndexOf("/");
    const dir = cut < 0 ? "" : file.path.slice(0, cut).replaceAll("_", " ");
    if (dir !== folder) { folder = dir; list.append(el("li", { className: "folder", textContent: dir })); }
    const href = `/api/runs/${encodeURIComponent(run.id)}/files/${file.path.split("/").map(encodeURIComponent).join("/")}`;
    list.append(el("li", {}, el("a", { href, target: "_blank", rel: "noopener", textContent: file.path.slice(cut + 1) }),
      el("span", { className: "muted small", textContent: `  ${Math.max(1, Math.round(file.bytes / 1024))} KB` })));
  }
  const button = $("run-now");
  button.disabled = !done;
  button.textContent = done ? t("run_now") : t("running");
  return done;
}

async function watch(runId) {
  clearTimeout(state.timer);
  state.watching = runId;
  try {
    const run = await api(`/api/runs/${encodeURIComponent(runId)}`);
    if (state.watching !== runId) return;
    if (renderRun(run)) { await loadRuns(); }
    else { state.timer = setTimeout(() => watch(runId), 1200); }
  } catch (error) {
    if (error.status === 401) return start();
    state.timer = setTimeout(() => watch(runId), 3000);
  }
}

async function loadRuns() {
  state.runs = (await api("/api/runs")).runs;
  renderHistory();
}

function renderDash() {
  const me = state.me;
  $("church-name").textContent = me.church.name;
  document.title = `${me.church.name} · Advanced Reports`;
  $("who").textContent = me.person.name;
  $("needs-reconnect").hidden = me.church.status !== "needs_reconnect";
  const pco = me.connections.pco;
  $("conn-pco").className = `pill ${pco ? "ok" : "bad"}`;
  $("conn-pco").textContent = pco ? t("connected") : t("not_connected");
  $("conn-pco-note").textContent = pco ? t("pco_" + pco.kind) : "";
  const form = $("church-form");
  form.language.replaceChildren(...me.options.languages.map(code =>
    el("option", { value: code, textContent: t("lang_" + code) })));
  form.theme.replaceChildren(el("option", { value: "", textContent: t("theme_none") }),
    ...me.options.themes.map(key => el("option", { value: key, textContent: t("theme_" + key) })));
  form.name.value = me.church.name;
  form.timezone.value = me.church.timezone;
  form.language.value = me.church.language;
  form.theme.value = me.church.theme || "";
  for (const key of ["verse_text", "verse_ref", "help_contact", "feedback_url"]) form[key].value = me.church.branding[key] || "";
  renderReports();
  renderHistory();
}

async function start() {
  clearTimeout(state.timer);
  applyText();
  try {
    state.me = await api("/api/me");
  } catch (error) {
    state.me = null;
    $("dash").hidden = true; $("logout").hidden = true; $("signin").hidden = false;
    $("church-name").textContent = "Advanced Reports"; $("who").textContent = "";
    renderSignin(await api("/api/auth/config"));
    return;
  }
  $("signin").hidden = true; $("dash").hidden = false; $("logout").hidden = false;
  state.reports = (await api("/api/modules/checkin_reports")).reports;
  await loadRuns();
  renderDash();
  const latest = state.runs[0];
  if (latest) watch(latest.id); else { $("run-live").hidden = true; $("run-now").disabled = false; }
}

$("lang").addEventListener("click", () => {
  lang = lang === "en" ? "es" : "en";
  try { localStorage.setItem("ar_lang", lang); } catch (e) {}
  start();
});
$("logout").addEventListener("click", async () => { await api("/auth/logout", { method: "POST" }); start(); });
$("run-now").addEventListener("click", async () => {
  $("run-error").textContent = "";
  $("run-now").disabled = true;
  try { const run = await api("/api/runs", { method: "POST" }); await loadRuns(); watch(run.id); }
  catch (error) { $("run-error").textContent = error.message; $("run-now").disabled = false; }
});
$("church-form").addEventListener("submit", async event => {
  event.preventDefault();
  const form = event.target, message = $("church-msg");
  message.className = "small"; message.textContent = "";
  try {
    state.me.church = await api("/api/church", { method: "PUT", body: {
      name: form.name.value, timezone: form.timezone.value.trim(), language: form.language.value,
      theme: form.theme.value || null,
      branding: { verse_text: form.verse_text.value, verse_ref: form.verse_ref.value,
                  help_contact: form.help_contact.value, feedback_url: form.feedback_url.value.trim() } } });
    renderDash();
    message.textContent = t("saved");
  } catch (error) { message.className = "small error"; message.textContent = error.message; }
});
$("disconnect").addEventListener("click", async () => {
  if (!window.confirm(t("confirm_disconnect"))) return;
  await api("/api/disconnect", { method: "POST" });
  start();
});
try {
  $("tz-list").replaceChildren(...Intl.supportedValuesOf("timeZone").map(zone => el("option", { value: zone })));
} catch (e) {}
start();
</script>
</body>
</html>
