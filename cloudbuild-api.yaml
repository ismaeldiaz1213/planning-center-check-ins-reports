# cloudbuild-api.yaml
#
# Builds and pushes the API service Docker image to Artifact Registry.
#
# Submit with:
#   gcloud builds submit \
#     --config cloudbuild-api.yaml \
#     --project ibl-planning-center-check-ins
#
# Prerequisites (run locally before submitting):
#   cd frontend && npm run build   ← ensures backend/static/ is present in context

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - us-central1-docker.pkg.dev/ibl-planning-center-check-ins/roster-repo/roster-api:latest
      - .

images:
  - us-central1-docker.pkg.dev/ibl-planning-center-check-ins/roster-repo/roster-api:latest
